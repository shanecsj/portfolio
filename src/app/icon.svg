<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Semicolon">
  <!--
    Site icon: a black semicolon on a white disc.

    Sized for 16px, which is what a browser tab actually renders:

    - The disc is pure white and full-bleed, so on dark browser chrome it reads
      as the icon's silhouette, and on light chrome it melts into the bar and
      leaves the glyph alone. Either way the semicolon stays black-on-white, so
      no theme-aware variant is needed (Safari ignores those anyway).
    - Both lobes are drawn far heavier than a typeset semicolon. At 16px each
      13-unit lobe is barely 3px across; anything typographically correct would
      thin to a smudge.
    - The gap between them is 5 units — about a pixel at tab size. Closing it
      any further fuses the two lobes into one vertical blob and the glyph stops
      reading as punctuation.
    - The tail tapers to a point rather than a blunt cut, which is what
      distinguishes the lower lobe from the upper one once the tail itself is
      too thin to resolve.
  -->
  <circle cx="32" cy="32" r="32" fill="#ffffff"/>
  <circle cx="32" cy="21" r="6.5" fill="#17171a"/>
  <circle cx="32" cy="39" r="6.5" fill="#17171a"/>
  <path d="M38.5 39 C38.5 45.5 34.2 50.5 27.4 52.8 C31.4 47.5 33 43.5 33 39 Z"
        fill="#17171a"/>
</svg>
